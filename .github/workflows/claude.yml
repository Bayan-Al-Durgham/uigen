name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      # 📦 1. تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ⚙️ 2. تجهيز المشروع (آمن حتى لو لا يوجد package.json)
      - name: Project Setup
        run: |
          if [ -f package.json ]; then
            npm install
            npm run dev & sleep 10
          else
            echo "No Node.js project detected"
          fi

      # 🤖 3. تشغيل Claude
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # 🧠 تعليمات المشروع
          custom_instructions: |
            The project is already set up.
            If a dev server exists, it may run on localhost:3000.
            Use clean code and best practices.
            If needed, run npm or node commands.
            You can analyze the UI using Playwright.

          # 🤖 MCP (Playwright)
          mcp_config: |
            {
              "mcpServers": {
                "playwright": {
                  "command": "npx",
                  "args": ["@playwright/mcp@latest"],
                  "env": {}
                }
              }
            }

          # 🔐 الصلاحيات (مهم جدًا)
          allowed_tools: "Bash(npm:*),Bash(node:*),Bash(npx:*),mcp__playwright__browser_snapshot,mcp__playwright__browser_click"
